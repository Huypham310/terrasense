# Full stack: Postgres + API + web.
# The API needs artifacts/model.onnx and model_meta.json (train + export, or download them from
# the GitHub release, see README).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: terrasense
      POSTGRES_PASSWORD: terrasense
      POSTGRES_DB: terrasense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrasense"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      TERRASENSE_DATABASE_URL: postgresql+psycopg://terrasense:terrasense@db:5432/terrasense
      TERRASENSE_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # the browser calls the API directly, so this is the host-facing url
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
