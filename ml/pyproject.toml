[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasense"
version = "0.1.0"
description = "Training pipeline for EuroSAT land-use classification"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.9",
  "torchvision>=0.24",
  "mlflow>=2.17",
  "onnx>=1.17",
  "onnxscript>=0.1",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7"]

[project.scripts]
terrasense-train = "terrasense.train:main"
terrasense-evaluate = "terrasense.evaluate:main"
terrasense-export = "terrasense.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["terrasense"]
